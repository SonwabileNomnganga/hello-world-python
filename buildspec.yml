version:
  0.2 phases: 
    install: 
      runtime-versions: 
        python: 3.11 
      commands: 
        - echo "Installing dependencies..." 
        - pip install pytest 
  pre_build: 
    commands: 
      - echo "Running pre-build checks..." 
      - python --version 
      - pip list 
  build: 
    commands: 
      - echo "Build started on $(date)" 
      - echo "Running tests..." 
      - python -m pytest test_app.py -v 
      - echo "Running the application..." 
      - python app.py 
  post_build: 
    commands: 
      - echo "Build completed on $(date)" 
      - echo "All steps passed successfully!" 
  artifacts: 
    files: 
      - app.py 
      - test_app.py 
      - buildspec.yml
