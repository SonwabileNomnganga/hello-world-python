name: CI/CD Pipeline - Trigger CodeBuild 
on: 
  push: 
    branches: main 
  pull_request: 
    branches: main 
jobs: 
  trigger-codebuild: 
    name: Trigger AWS CodeBuild 
    runs-on: ubuntu-latest 
      steps: 
        name: Print GitHub context
        run: 
          echo "Event name: ${{ github.event_name }}"
          uses: actions/github-script@v7 
          with: 
          script: | console.log("GitHub Context:", JSON.stringify(github, null, 2))
name: Checkout code 
  uses: actions/checkout@v4 
name: Configure AWS credentials 
  uses: aws-actions/configure-aws-credentials@v4 
    with: 
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} 
      aws-region: us-east-1 # ← change to your AWS region 
name: Start CodeBuild and wait for result 
  run: | BUILD_ID=$(aws codebuild start-build \ --project-name hello-world-python \ --source-version ${{ github.sha }} \ --query 'build.id' \ --output text) 
  echo "Started build: $BUILD_ID" # Poll until the build finishes while true; do STATUS=$(aws codebuild batch-get-builds \ --ids "$BUILD_ID" \ --query 'builds[0].buildStatus' \ --output text) 
  echo "Build status: $STATUS" if [ "$STATUS" = "SUCCEEDED" ]; then echo "✅ Build succeeded!" exit 0 elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "STOPPED" ]; then echo "❌ Build failed with status: $STATUS" exit 1 fi sleep 15 done